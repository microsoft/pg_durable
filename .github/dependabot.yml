# Dependabot configuration for weekly dependency updates.
#
# Dependabot opens dependency PRs through its own permission system, which is
# NOT governed by the "Allow GitHub Actions to create and approve pull requests"
# org/repo setting. This lets it raise update PRs even where that setting is
# disabled by policy.
#
# Update Cargo.toml when a new version requires it. The ignored crates need
# coordinated manual upgrades: pgrx with pgrx-tests, and duroxide with duroxide-pg.
# Exact `=` pins alone do not prevent Dependabot from proposing manifest edits.
#
# The single "cargo" group collapses all updates into one weekly PR instead of
# one PR per crate. CI validates the committed lockfile. Review pre-1.0 minor
# upgrades as potentially breaking, regardless of Dependabot's update label.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Etc/UTC"
    versioning-strategy: auto
    ignore:
      - dependency-name: pgrx
      - dependency-name: pgrx-tests
      - dependency-name: duroxide
      - dependency-name: duroxide-pg
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
